name: Daily SEC Ingestion

on:
  schedule:
    # Times are UTC and anchored to EDT (UTC-4); in winter (EST) they land ~1h later ET.
    # Trimmed to 2 weekday runs to cut Turso rows-read: the morning run does the
    # full heavy precompute (hour <= 14 UTC), the after-close run is light-only.
    - cron: '0 14 * * 1-5'    # ~10:00 AM ET  (30 min after open, HEAVY)
    - cron: '0 16 * * 1-5'    # ~12:00 PM ET  (midday, light + leaderboard refresh)
    - cron: '14 20 * * 1-5'   # ~4:14 PM ET   (just after close, light)
    - cron: '0 13 * * 0,6'    # ~9:00 AM ET   (once each weekend day)
    - cron: '0 11 * * 0'      # ~7:00 AM ET Sunday - WEEKLY heavy backtest study (FORCE_FULL)
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Number of days to backfill'
        required: false
        default: '3'
      refetch_cik:
        description: 'Recover one issuer: re-fetch ALL its recent Form 4s by CIK (e.g. 1577552 = Alibaba), bypassing dedup. Leave blank for a normal backfill.'
        required: false
        default: ''
      resweep_days:
        description: 'Systematic recovery: clear dedup for the last N days and re-fetch that window completely for ALL tickers (max 21). Leave blank for a normal backfill.'
        required: false
        default: ''
      force_full:
        description: 'Also rerun the heavy 5-year backtest study (thousands of Yahoo calls, ~30+ min). Leave off for normal and recovery runs.'
        required: false
        default: false
        type: boolean

# Scheduled runs still cancel each other (no point stacking short daily runs).
# But a MANUAL run (workflow_dispatch) gets its own group and is never cancelled,
# so a long recovery backfill can't be killed mid-flight by a cron that fires.
# Overlap is safe: inserts are idempotent (UNIQUE constraint + seen_filings dedup).
concurrency:
  group: sec-ingest-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run SEC Form 4 ingestion
        run: |
          if [ -n "${{ github.event.inputs.refetch_cik }}" ]; then
            node daily-worker.js issuer "${{ github.event.inputs.refetch_cik }}"
          elif [ -n "${{ github.event.inputs.resweep_days }}" ]; then
            node daily-worker.js resweep "${{ github.event.inputs.resweep_days }}"
          else
            node daily-worker.js ${{ github.event.inputs.days_back || '3' }} backfill
          fi
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN:   ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Pre-compute cached queries
        run: node scripts/precompute.js
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN:   ${{ secrets.TURSO_AUTH_TOKEN }}
          # The heavy market-wide backtest study (thousands of Yahoo calls, ~30+ min)
          # runs ONCE A WEEK on the Sunday cron, or on an explicit force_full manual
          # run. Every other scheduled run and every recovery/backfill stays fast.
          FORCE_FULL: ${{ (github.event.inputs.force_full == 'true' || github.event.schedule == '0 11 * * 0') && '1' || '' }}
