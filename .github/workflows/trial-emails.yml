name: Trial Lifecycle Emails

on:
  schedule:
    - cron: '0 16 * * *'    # daily, 16:00 UTC (~11am-12pm ET) - a good open time
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Send one sample welcome + ending to this address (touches nothing else)'
        required: false
      dry_run:
        description: 'Set to 1 to list who WOULD get what, without sending'
        required: false
        default: ''

concurrency:
  group: trial-emails
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Debug secret presence (no value exposed)
        run: |
          echo "repo secret STRIPE_SECRET_KEY non-empty? ${{ secrets.STRIPE_SECRET_KEY != '' }}"
          echo "repo secret STRIPE_SECRET     non-empty? ${{ secrets.STRIPE_SECRET != '' }}"
          echo "env STRIPE_SECRET_KEY length: ${#STRIPE_SECRET_KEY}"
          echo "env STRIPE_SECRET length (0 = not reaching job; ~107 = sk_live key; ~38 = whsec): ${#STRIPE_SECRET}"
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_SECRET:     ${{ secrets.STRIPE_SECRET }}

      - name: Send trial lifecycle emails
        run: node scripts/trial-emails.js
        env:
          # Accept either secret name - the script reads STRIPE_SECRET_KEY first,
          # then STRIPE_SECRET. Your GitHub secret is named STRIPE_SECRET (holds the
          # sk_live_ API key), so that one flows through.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_SECRET:     ${{ secrets.STRIPE_SECRET }}
          RESEND_KEY:    ${{ secrets.RESEND_KEY }}
          SITE_URL:      https://www.insidertape.com
          FROM_EMAIL:    ${{ secrets.FROM_EMAIL }}
          REPLY_TO:      ${{ secrets.REPLY_TO }}
          TEST_EMAIL:    ${{ github.event.inputs.test_email }}
          DRY_RUN:       ${{ github.event.inputs.dry_run }}
