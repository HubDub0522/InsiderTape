name: Trial Lifecycle Emails

on:
  schedule:
    - cron: '0 16 * * *'    # daily, 16:00 UTC (~11am-12pm ET) - a good open time
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Send one sample welcome + ending to this address (touches nothing else)'
        required: false
      dry_run:
        description: 'Set to 1 to list who WOULD get what, without sending'
        required: false
        default: ''

concurrency:
  group: trial-emails
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Send trial lifecycle emails
        run: node scripts/trial-emails.js
        env:
          STRIPE_SECRET: ${{ secrets.STRIPE_SECRET }}
          RESEND_KEY:    ${{ secrets.RESEND_KEY }}
          SITE_URL:      https://www.insidertape.com
          FROM_EMAIL:    ${{ secrets.FROM_EMAIL }}
          REPLY_TO:      ${{ secrets.REPLY_TO }}
          TEST_EMAIL:    ${{ github.event.inputs.test_email }}
          DRY_RUN:       ${{ github.event.inputs.dry_run }}
